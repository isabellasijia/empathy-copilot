<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f5f7" />
    <title>共情双舱 · 效果评测</title>
    <script src="/static/lucide.min.js"></script>
    <link rel="stylesheet" href="/static/evaluation.css?v=20260915-3" />
  </head>
  <body>
    <a class="skip-link" href="#evaluationMain">跳到评测内容</a>
    <header class="evaluation-header">
      <a class="brand" href="/?case=S00018" aria-label="返回客服工作台">
        <span class="brand-icon" aria-hidden="true"><i data-lucide="sparkles"></i></span>
        <span><strong>共情双舱</strong><small>效果评测</small></span>
      </a>
      <div class="header-context" aria-label="评测数据说明">
        <span><i data-lucide="database"></i>官方模拟业务数据</span>
        <span><i data-lucide="rotate-ccw"></i>可重放场景</span>
      </div>
      <div class="header-actions">
        <span class="updated-at" id="updatedAt" aria-live="polite">正在计算…</span>
        <button class="icon-button" id="refreshEvaluation" type="button" aria-label="刷新评测结果" title="刷新评测结果">
          <i data-lucide="refresh-cw"></i>
        </button>
        <a class="back-link" href="/?case=S00018"><i data-lucide="arrow-left"></i>返回服务台</a>
      </div>
    </header>

    <main class="evaluation-main" id="evaluationMain" tabindex="-1">
      <section class="scoreboard" aria-labelledby="evaluationTitle">
        <div class="score-intro">
          <div class="eyebrow">服务效果总览</div>
          <h1 id="evaluationTitle">关键场景全部通过</h1>
          <p>从读懂诉求到风险拦截，结果均可复算。</p>
        </div>
        <div class="primary-score">
          <span>综合通过率</span>
          <strong id="metricPassRate">…</strong>
          <small id="metricPassMeta">正在计算</small>
        </div>
        <dl class="metric-strip" aria-label="核心评测指标">
          <div>
            <dt>复杂意图实测</dt>
            <dd id="metricUnderstanding">…</dd>
            <small>否定、纠错、歧义</small>
          </div>
          <div>
            <dt>风险与回复安全</dt>
            <dd id="metricSafety">…</dd>
            <small>关键错误有效拦截</small>
          </div>
          <div>
            <dt>单次分析耗时</dt>
            <dd id="metricLatency">…</dd>
            <small>最近真实执行</small>
          </div>
          <div>
            <dt>单次模型用量</dt>
            <dd id="metricTokens">…</dd>
            <small>输入 + 输出 Token</small>
          </div>
        </dl>
      </section>

      <div class="dashboard-grid">
        <section class="dashboard-panel dimension-panel" aria-labelledby="dimensionTitle">
          <div class="panel-heading">
            <div><span class="section-index">01</span><h2 id="dimensionTitle">能力覆盖</h2></div>
            <span class="panel-summary" id="dimensionSummary">7 个关键维度</span>
          </div>
          <div class="dimension-chart" id="dimensionChart" aria-live="polite"></div>
        </section>

        <section class="dashboard-panel scenario-panel" aria-labelledby="scenarioTitle">
          <div class="panel-heading">
            <div><span class="section-index">02</span><h2 id="scenarioTitle">典型场景验证</h2></div>
            <span class="result-badge" id="suiteBadge">计算中</span>
          </div>
          <div class="scenario-list" id="evaluationCases" aria-live="polite">
            <div class="loading-state">正在运行评测…</div>
          </div>
        </section>

        <section class="dashboard-panel evidence-panel" aria-labelledby="evidenceTitle">
          <div class="panel-heading">
            <div><span class="section-index">03</span><h2 id="evidenceTitle">效率与成本</h2></div>
            <span class="panel-summary">真实运行数据</span>
          </div>
          <dl class="evidence-list" id="costEvidence"></dl>
          <div class="knowledge-evidence" id="knowledgeEvidence"></div>
        </section>
      </div>

      <section class="workflow-panel" aria-labelledby="workflowTitle">
        <div class="workflow-heading">
          <div>
            <span class="section-index">04</span>
            <div><h2 id="workflowTitle">本次真实处理链路</h2><p>仅展示实际执行节点</p></div>
          </div>
          <span class="workflow-total" id="routeBadge">读取中</span>
        </div>
        <ol class="workflow-track" id="workflowTrack" aria-live="polite"></ol>
        <p class="workflow-result" id="workflowResult"></p>
      </section>
    </main>
    <script src="/static/evaluation.js?v=20260915-3"></script>
  </body>
</html>
